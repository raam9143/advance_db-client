name: security-and-supply-chain
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-fund
      - name: Block high-severity production JavaScript vulnerabilities
        run: npm audit --omit=dev --audit-level=high
  go-vuln:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false
      - run: go mod download && go mod verify
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: advance-db-client-sbom.spdx.json

  container-image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build locked backend container image
        run: docker build --pull --tag advance-db-api:security ./backend
      - name: Scan API image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: advance-db-api:security
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Build locked frontend container image
        run: docker build --pull --tag advance-db-web:security ./frontend
      - name: Scan frontend image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: advance-db-web:security
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  production-compose-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose syntax (synthetic, non-secret values)
        env:
          API_TOKEN: "synthetic-api-token-at-least-32-chars-long"
          AUDIT_HMAC_KEY: "synthetic-audit-key-at-least-32-chars"
          VAULT_ACTIVE_KEY_B64: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
          ADB_DATA_DIR: "/tmp/adb-data-ci"
          ADB_AUDIT_DIR: "/tmp/adb-audit-ci"
          ADB_VAULT_DIR: "/tmp/adb-vault-ci"
          DB_ENDPOINT_ALLOWLIST: "db.example.org:5432"
          APP_SESSION_SECRET: "synthetic-session-secret-at-least-32-chars"
          APP_PUBLIC_ORIGIN: "https://db.example.org"
          OIDC_ISSUER: "https://sso.example.org"
          OIDC_CLIENT_ID: "adb-ci"
          OIDC_REDIRECT_URI: "https://db.example.org/api/auth/oidc/callback"
          OIDC_ADMIN_GROUP: "adb-admin"
          OIDC_VIEWER_GROUP: "adb-viewer"
          OIDC_REQUIRED_AMR: "mfa"
          SESSION_REDIS_URL: "rediss://redis.example.org:6380"
        run: docker compose -f deploy/compose.production.yml config --quiet
