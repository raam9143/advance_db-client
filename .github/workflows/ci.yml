name: quality-gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: adb
          POSTGRES_USER: adb
          POSTGRES_PASSWORD: adbtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adb -d adb" --health-interval 10s --health-timeout 5s --health-retries 10
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\"" --health-interval 10s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 12
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: adb
          MYSQL_USER: adb
          MYSQL_PASSWORD: adbtest
          MYSQL_ROOT_PASSWORD: ci-only-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pci-only-root" --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_MYSQL_HOST: 127.0.0.1
      TEST_REDIS_HOST: 127.0.0.1
      TEST_MONGO_HOST: 127.0.0.1
      MONGO_ALLOW_PLAINTEXT_LOOPBACK: 'true'
      REDIS_ALLOW_PLAINTEXT_LOOPBACK: 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false
      - name: Verify pinned Go dependencies
        run: |
          go mod download
          go mod verify
          go mod tidy -diff
      - run: go test -race ./...
      - name: Explicit MongoDB live read-only integration
        run: go test -race -run TestMongoLiveReadonly -count=1 -v ./integration
      - run: go vet ./...
      - run: go build ./cmd/api
  frontend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      SESSION_REDIS_URL: redis://127.0.0.1:6379
      SESSION_REDIS_ALLOW_PLAINTEXT_LOOPBACK: 'true'
      SESSION_REDIS_REQUIRED: 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify locked frontend dependency graph
        run: npm ci --no-audit --no-fund
      - run: node --test lib/session-store.test.mjs lib/production-policy.test.mjs
      - run: npm run typecheck
      - run: npm run build

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test mcp/server.test.mjs frontend/lib/totp.test.mjs frontend/lib/oidc.test.mjs deploy/qualification/check.test.mjs

  clickhouse-http:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.3
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'" --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      TEST_CLICKHOUSE_HOST: 127.0.0.1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false
      - run: go mod download && go mod verify
      - run: go test -race ./internal/chhttp ./internal/server ./cmd/adbctl
      - name: Test against live ClickHouse over verified test TLS
        run: go test -race -run TestLiveClickHouseHTTPSProxy -count=1 -v ./internal/chhttp
      - run: go vet ./internal/chhttp ./internal/server ./cmd/adbctl

  sqlserver-integration:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Test_0nly_Str0ng_2026!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/bin/bash -c 'echo > /dev/tcp/127.0.0.1/1433'"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 30s
    env:
      TEST_MSSQL_HOST: 127.0.0.1
      TEST_MSSQL_PASSWORD: "Test_0nly_Str0ng_2026!"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false
      - run: go mod download && go mod verify
      - name: Live Microsoft SQL Server database integration
        run: go test -race -run '^TestSQLServerLive$' -count=1 -v ./integration

  browser-e2e:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      API_TOKEN: 'e2e-local-api-token-only'
      APP_PASSWORD: 'e2e-long-password-for-test-only'
      APP_SESSION_SECRET: 'e2e-test-only-session-secret-longer-than-thirty-two'
      GO_API_URL: http://127.0.0.1:8080
      API_LISTEN: 127.0.0.1:8080
      OIDC_REQUIRED: 'false'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen browser test dependencies
        run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: phase6-browser-failures
          path: frontend/test-results/
          if-no-files-found: ignore
