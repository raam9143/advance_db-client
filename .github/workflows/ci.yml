name: quality-gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: adb
          POSTGRES_USER: adb
          POSTGRES_PASSWORD: adbtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adb -d adb" --health-interval 10s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: adb
          MYSQL_USER: adb
          MYSQL_PASSWORD: adbtest
          MYSQL_ROOT_PASSWORD: ci-only-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pci-only-root" --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_MYSQL_HOST: 127.0.0.1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Resolve Go dependencies and emit reproducible checksums
        run: |
          go mod tidy
          echo '===ADB_GO_SUM_BEGIN==='
          cat go.sum
          echo '===ADB_GO_SUM_END==='
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/api
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test mcp/server.test.mjs

  clickhouse-http:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - run: go test -race ./internal/chhttp ./internal/server ./cmd/adbctl
      - run: go vet ./internal/chhttp ./internal/server ./cmd/adbctl
