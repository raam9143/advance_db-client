name: production-qualification-evidence
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    environment: production-approval
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Require externally reviewed evidence bundle
        run: node deploy/qualification/check.mjs deploy/evidence/phase6.json "${GITHUB_SHA}"
      - name: Verify all three CI and security workflows on the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for workflow in ci.yml security.yml release-candidate.yml; do
            result="$(gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&per_page=10" --jq '.workflow_runs | map(select(.head_sha==env.GITHUB_SHA and .conclusion=="success")) | length')"
            test "$result" -ge 1 || { echo "Missing successful $workflow on $GITHUB_SHA"; exit 1; }
          done
      - name: Require configured active main-branch protections
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/rulesets?includes_parents=true" > /tmp/adb-rulesets.json
          jq -e 'any(.[]; .enforcement=="active" and .target=="branch" and any(.rules[]?; .type=="pull_request"))' /tmp/adb-rulesets.json
      - name: Evidence qualification scope
        run: |
          echo "Evidence-format and CI gates passed. This workflow does not itself confer any external security certification."
